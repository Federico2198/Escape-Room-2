<meta name="claude:viewport-fit-sides" content="cover">
<title>Laboratorio de IA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: barra fija con pestañas (una por actividad + resumen). Cada actividad apila: la idea, la práctica interactiva, preguntas y notas para el docente. */
:root{
  --ink:#0B2545; --ink-2:#1B3C6B; --paper:#E8F0F6; --panel:#FFFFFF; --line:#C5D3E0; --dot:#CBD9E6; --muted:#4A6178;
  --robot:#D9480F; --robot-dk:#A93608; --robot-soft:#FFE6DA;
  --signal:#0A7F8C; --signal-soft:#D6F2F4; --sun:#FFC933;
  --ok:#16794A; --ok-soft:#D9F2E3; --bad:#B8283A; --bad-soft:#FBDDE1;
  --c-a:#D9480F; --c-b:#1B6FB5; --c-c:#7B4BB7; --c-d:#9A7400; --c-e:#2E7D32; --c-f:#C2185B;
  --f-display:'Chakra Petch',system-ui,sans-serif; --f-body:'Atkinson Hyperlegible',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.4px);background-size:22px 22px;color:var(--ink);font:400 17px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:30}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#fff;border-bottom:4px solid var(--sun)}
.top-in{max-width:1100px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:700 20px var(--f-display);letter-spacing:.02em}
.led{width:12px;height:12px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.top .sub{font-size:14px;color:#A9C0DA}
.tabs{max-width:1100px;margin:0 auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;gap:6px;overflow-x:auto}
.tab{flex:none;border:0;background:var(--ink-2);color:#DCE8F5;font:700 14px var(--f-display);letter-spacing:.03em;padding:9px 14px;border-radius:10px 10px 0 0;cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap}
.tab:hover{background:#25497F}
.tab.on{background:var(--paper);color:var(--ink)}
.tab i{width:10px;height:10px;border-radius:50%;border:2px solid #7F9BBB;display:block}
.tab.done i{background:#4ADE80;border-color:#4ADE80}

.app{max-width:1100px;margin:0 auto;padding-block:22px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lab{display:grid;gap:18px}
.lab-head{display:grid;gap:8px;justify-items:start}
.lab-head h1{font-size:clamp(28px,5vw,44px)}
.panel{background:var(--panel);border:2px solid var(--ink);border-radius:14px;padding:20px;display:grid;gap:14px;min-width:0}
.eyebrow{font:700 12px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--robot)}
.chip{display:inline-block;font:700 12px var(--f-display);letter-spacing:.1em;text-transform:uppercase;background:var(--signal-soft);color:var(--signal);padding:4px 10px;border-radius:999px}
.idea p+p{margin-top:8px}
.words{display:flex;gap:8px;flex-wrap:wrap}
.words span{background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:4px 10px;font-size:15px}
.words b{font-family:var(--f-display)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 16px;font:700 16px var(--f-body);cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(1px);box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--robot);border-color:var(--robot-dk);color:#fff;box-shadow:0 4px 0 var(--robot-dk)}
.btn.primary:hover{box-shadow:0 3px 0 var(--robot-dk)} .btn.primary:active{box-shadow:0 0 0 var(--robot-dk)}
.btn.small{padding:6px 12px;font-size:14px;box-shadow:0 3px 0 var(--ink)}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:#fff;padding:7px 13px;font-weight:700;cursor:pointer}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.field{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700}
.note{border-radius:10px;padding:12px 14px;font-weight:700}
.note.ok{background:var(--ok-soft);color:var(--ok)} .note.bad{background:var(--bad-soft);color:var(--bad)} .note.info{background:var(--signal-soft);color:var(--signal)}
.note p+p{margin-top:6px;font-weight:400;color:var(--ink)}
.section-title{font:700 13px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.side{display:grid;gap:12px;align-content:start}
.stat{background:var(--paper);border-radius:10px;padding:10px 14px}
.stat b{display:block;font:700 30px var(--f-mono);font-variant-numeric:tabular-nums}
.stat small{color:var(--muted)}
.plot{background:#fff;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.plot svg{display:block;width:100%;height:auto;touch-action:manipulation}
.plot text{font-family:var(--f-body);fill:var(--muted);font-size:12px}
.plot .ttl{font-weight:700;fill:var(--ink);font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{display:inline-block;width:14px;height:14px}
.legend .ci{border-radius:50%} .legend .sq{border-radius:2px}
.card-ex{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;background:var(--paper);border-radius:12px;padding:12px}
.card-ex .em{font-size:52px;line-height:1;grid-row:span 2}
.card-ex .m{font:500 15px var(--f-mono)}
.bigact{display:flex;gap:10px;flex-wrap:wrap}
.bigact .btn{flex:1;min-width:110px}

/* Preguntas */
.qq{display:grid;gap:10px}
.qq+.qq{border-top:2px dashed var(--line);padding-top:14px}
.qq h3{font-size:18px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt .k{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:700 15px var(--f-display)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)} .opt.nogood{border-color:var(--bad);background:var(--bad-soft)}
details.teacher summary{cursor:pointer;font:700 16px var(--f-display);letter-spacing:.04em}
details.teacher[open] summary{margin-bottom:10px}
details.teacher h4{margin:12px 0 4px;font:700 14px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--signal)}
details.teacher ul{margin:0;padding-left:20px;display:grid;gap:4px}

/* Resumen */
.cmp{overflow-x:auto}
table.cmp-t{border-collapse:collapse;width:100%;min-width:640px;font-size:15px}
table.cmp-t th,table.cmp-t td{border-bottom:1.5px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.cmp-t th{font:700 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.prog div{display:flex;gap:8px;align-items:center;background:var(--paper);border-radius:10px;padding:8px 12px;font-weight:700}
.prog div.done{background:var(--ok-soft);color:var(--ok)}

/* Refuerzo */
.world{display:grid;grid-template-columns:repeat(6,var(--cell));gap:4px;--cell:clamp(42px,13vw,62px);justify-content:center}
.cell{width:var(--cell);height:var(--cell);border:2px solid var(--line);border-radius:8px;background:#F3F8FC;display:grid;place-items:center;font-size:calc(var(--cell)*.46);position:relative;padding:0;cursor:pointer;overflow:hidden}
.cell .ar{position:absolute;right:3px;bottom:0;font:700 14px var(--f-display);color:var(--ink)}
.cell.wall{background:var(--ink);border-color:var(--ink);cursor:default}
.cell.goal{border-color:var(--ok);cursor:default} .cell.start{border-color:var(--ink-2);cursor:default}
.cell .bot{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cell)*.55)}

/* Neurona */
.rowline{display:grid;grid-template-columns:auto minmax(120px,1fr) 44px;gap:10px;align-items:center}
.rowline input[type=range]{width:100%;accent-color:var(--robot);height:28px}
.rowline output{font:700 18px var(--f-mono);text-align:right}
.tog{border:2px solid var(--ink);border-radius:999px;background:#fff;padding:5px 14px;font-weight:700;cursor:pointer;min-width:74px}
.tog.on{background:var(--sun)}
table.tt{border-collapse:collapse;width:100%;font-size:15px}
table.tt th,table.tt td{border-bottom:1.5px solid var(--line);padding:6px 8px;text-align:center}
table.tt tr.cur td{background:var(--sun)}
table.tt td.good{color:var(--ok);font-weight:700} table.tt td.bad{color:var(--bad);font-weight:700}

/* Lenguaje */
.sentence{font:500 22px/1.4 var(--f-display);min-height:64px;background:var(--paper);border-radius:12px;padding:14px 16px}
.sentence .cur{display:inline-block;width:10px;height:1.1em;background:var(--robot);vertical-align:text-bottom;animation:blink 1s steps(2) infinite}
.nexts{display:grid;gap:6px}
.nx{display:grid;grid-template-columns:110px 1fr 48px;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;text-align:left}
.nx:hover{border-color:var(--ink)}
.nx .tr{height:14px;background:#E6EDF4;border-radius:999px;overflow:hidden}
.nx .tr i{display:block;height:100%;background:var(--signal)}
.nx b{font:700 14px var(--f-mono);text-align:right}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:60;font-weight:700;max-width:90vw;text-align:center}
.toast[hidden]{display:none}
@keyframes blink{50%{opacity:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:820px){
  .two{grid-template-columns:1fr}
  .nx{grid-template-columns:90px 1fr 44px}
}
</style>
<header class="top">
  <div class="top-in"><div class="brand"><span class="led"></span><span>Laboratorio de IA</span></div><span class="sub">Cómo aprenden las máquinas</span></div>
  <nav class="tabs" id="nav" aria-label="Actividades"></nav>
</header>
<main class="app" id="app"></main>
<div class="toast" id="toast" hidden></div>
<script>
'use strict';
const STORE = 'robi-lab-v1';
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(r) { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function shuffled(arr, seed) { const r = rng(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const fmt1 = n => (Math.round(n * 10) / 10).toString().replace('.', ',');

let S = { lab: 'sup', goal: {}, quiz: {} };
function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }
function load() { try { const o = JSON.parse(localStorage.getItem(STORE) || 'null'); if (o && typeof o === 'object') S = Object.assign(S, o); } catch (e) {} }
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800); }

const MOD = {};
const LABS = [
  { id: 'sup', tag: 'Supervisado',     title: 'Aprender con etiquetas' },
  { id: 'uns', tag: 'No supervisado',  title: 'Agrupar sin etiquetas' },
  { id: 'rl',  tag: 'Por refuerzo',    title: 'Aprender con premios y castigos' },
  { id: 'nn',  tag: 'Red neuronal',    title: 'La neurona que decide' },
  { id: 'lm',  tag: 'Lenguaje',        title: 'Predecir la próxima palabra' }
];
const ALL = LABS.map(l => l.id).concat('sum');
let cleanup = null;

/* ===== Preguntas ===== */
function quizOf(id) { return id === 'sum' ? SUMQ : MOD[id].quiz; }
function quizOk(id) { const st = S.quiz[id] || {}; return quizOf(id).every((q, i) => st[i] === q.a); }
function isDone(id) { return id === 'sum' ? quizOk('sum') : !!S.goal[id] && quizOk(id); }
function quizHtml(id) {
  const st = S.quiz[id] || {};
  return quizOf(id).map((q, i) => {
    const c = st[i];
    const opts = q.o.map((t, j) => '<button class="opt' + (c === j ? (j === q.a ? ' good' : ' nogood') : '') + '" data-quiz="' + id + '" data-q="' + i + '" data-o="' + j + '"><span class="k">' + 'ABC'[j] + '</span><span>' + esc(t) + '</span></button>').join('');
    const fb = c === undefined ? '' : '<div class="note ' + (c === q.a ? 'ok' : 'bad') + '"><p>' + (c === q.a ? '¡Correcto!' : 'Todavía no.') + '</p><p>' + esc(c === q.a ? q.why : q.hint) + '</p></div>';
    return '<div class="qq"><h3>' + (i + 1) + '. ' + esc(q.q) + '</h3><div class="opts">' + opts + '</div>' + fb + '</div>';
  }).join('');
}
function markGoal(id) {
  if (S.goal[id]) return;
  S.goal[id] = true; save(); renderNav(); toast('¡Objetivo logrado! Ahora respondé las preguntas de abajo.');
}

/* ===== Navegación ===== */
function renderNav() {
  $('#nav').innerHTML = LABS.map(l => '<button class="tab' + (S.lab === l.id ? ' on' : '') + (isDone(l.id) ? ' done' : '') + '" data-tab="' + l.id + '"><i></i>' + esc(l.tag) + '</button>').join('') +
    '<button class="tab' + (S.lab === 'sum' ? ' on' : '') + (isDone('sum') ? ' done' : '') + '" data-tab="sum"><i></i>Resumen</button>';
}
function go(id) {
  if (cleanup) { cleanup(); cleanup = null; }
  S.lab = id; save(); renderNav();
  if (id === 'sum') renderSummary(); else renderLab(id);
  window.scrollTo({ top: 0 });
}
function navButtons() {
  const i = ALL.indexOf(S.lab);
  return '<div class="actions">' + (i > 0 ? '<button class="btn" data-go="prev">← Anterior</button>' : '') + (i < ALL.length - 1 ? '<button class="btn primary" data-go="next">Siguiente →</button>' : '') + '</div>';
}
function renderLab(id) {
  const L = LABS.find(x => x.id === id), M = MOD[id];
  $('#app').innerHTML = '<section class="lab"><div class="lab-head"><span class="chip">' + esc(L.tag) + '</span><h1>' + esc(L.title) + '</h1></div>' +
    '<div class="panel idea"><span class="eyebrow">La idea</span>' + M.idea + '</div>' +
    '<div class="panel"><span class="eyebrow">Probá</span><div id="practice" style="display:grid;gap:14px"></div></div>' +
    '<div class="panel"><span class="eyebrow">Para pensar</span><div id="quiz" style="display:grid;gap:14px">' + quizHtml(id) + '</div></div>' +
    '<details class="panel teacher"><summary>Para el docente</summary>' + M.teacher + '</details>' + navButtons() + '</section>';
  const stop = M.mount($('#practice'));
  if (typeof stop === 'function') cleanup = stop;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t) return go(t.dataset.tab);
  const g = e.target.closest('[data-go]');
  if (g) { const n = ALL.indexOf(S.lab) + (g.dataset.go === 'next' ? 1 : -1); if (ALL[n]) go(ALL[n]); return; }
  const q = e.target.closest('[data-quiz]');
  if (q) {
    const id = q.dataset.quiz; (S.quiz[id] = S.quiz[id] || {})[q.dataset.q] = +q.dataset.o; save();
    $('#quiz').innerHTML = quizHtml(id); renderNav();
    const b = $('#quiz [data-q="' + q.dataset.q + '"][data-o="' + q.dataset.o + '"]'); if (b) b.focus({ preventScroll: true });
  }
});

/* ===== Gráfico de dispersión (SVG) compartido por las actividades 1 y 2 ===== */
function plotFrame(W, H, M, xr, yr, xt, yt, xl, yl) {
  const sx = v => M.l + (v - xr[0]) / (xr[1] - xr[0]) * (W - M.l - M.r);
  const sy = v => H - M.b - (v - yr[0]) / (yr[1] - yr[0]) * (H - M.t - M.b);
  let s = '<rect x="' + M.l + '" y="' + M.t + '" width="' + (W - M.l - M.r) + '" height="' + (H - M.t - M.b) + '" fill="#FFFFFF" stroke="#C5D3E0"/>';
  xt.forEach(v => { s += '<line x1="' + sx(v) + '" x2="' + sx(v) + '" y1="' + M.t + '" y2="' + (H - M.b) + '" stroke="#E6EDF4"/><text x="' + sx(v) + '" y="' + (H - M.b + 16) + '" text-anchor="middle">' + v + '</text>'; });
  yt.forEach(v => { s += '<line y1="' + sy(v) + '" y2="' + sy(v) + '" x1="' + M.l + '" x2="' + (W - M.r) + '" stroke="#E6EDF4"/><text x="' + (M.l - 6) + '" y="' + (sy(v) + 4) + '" text-anchor="end">' + v + '</text>'; });
  s += '<text class="ttl" x="' + (M.l + (W - M.l - M.r) / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + xl + '</text>';
  s += '<text class="ttl" transform="translate(14 ' + (M.t + (H - M.t - M.b) / 2) + ') rotate(-90)" text-anchor="middle">' + yl + '</text>';
  return { sx: sx, sy: sy, svg: s };
}
function plotPoint(e, svg, W, H, M, xr, yr) {
  const b = svg.getBoundingClientRect(), px = (e.clientX - b.left) / b.width * W, py = (e.clientY - b.top) / b.height * H;
  return { x: xr[0] + (px - M.l) / (W - M.l - M.r) * (xr[1] - xr[0]), y: yr[0] + (H - M.b - py) / (H - M.t - M.b) * (yr[1] - yr[0]) };
}
/* ===================== 1. SUPERVISADO ===================== */
(function () {
  const XR = [0, 40], YR = [10, 80], W = 560, H = 360, M = { l: 46, r: 12, t: 12, b: 44 };
  const COL = { gato: '#D9480F', perro: '#1B6FB5' }, EM = { gato: '🐱', perro: '🐶' }, NM = { gato: 'gato', perro: 'perro' };
  function make(cls, r) {
    return cls === 'gato' ? { x: clamp(4.4 + gauss(r) * 1.0, 2, 8), y: clamp(25 + gauss(r) * 3, 17, 34), c: 'gato' }
                          : { x: clamp(17 + gauss(r) * 6.5, 5, 38), y: clamp(48 + gauss(r) * 10, 26, 78), c: 'perro' };
  }
  const rt = rng(21), TEST = []; for (let i = 0; i < 24; i++) TEST.push(make(i % 2 ? 'perro' : 'gato', rt));
  const rp = rng(5), POOL = []; for (let i = 0; i < 40; i++) POOL.push(make(rp() < 0.5 ? 'gato' : 'perro', rp));
  const dist = (a, b) => { const dx = (a.x - b.x) / 40, dy = (a.y - b.y) / 70; return dx * dx + dy * dy; };
  function knn(train, p, k) {
    if (!train.length) return null;
    const nb = train.map(t => ({ t: t, d: dist(t, p) })).sort((a, b) => a.d - b.d).slice(0, Math.min(k, train.length));
    const v = { gato: 0, perro: 0 }; nb.forEach(n => v[n.t.c]++);
    return { label: v.gato === v.perro ? nb[0].t.c : (v.gato > v.perro ? 'gato' : 'perro'), nb: nb, v: v };
  }

  MOD.sup = {

      { q: 'Si la trampa no castiga (0 puntos), ¿qué puede pasar?', o: ['ROBI nunca va a pasar por ahí', 'ROBI puede cruzar la trampa si le conviene', 'ROBI deja de aprender'], a: 1, why: 'Si pasar por la trampa no le cuesta nada, puede ser un camino válido. La recompensa define lo que ROBI aprende.', hint: 'Probalo en la actividad: cambiá el castigo de la trampa y entrená de nuevo.' },

        const list = ended ? [] : probs(cur[cur.length - 1]).slice(0, 6);
        $('#nxts').innerHTML = list.map(o => '<button class="nx" data-w="' + esc(o.w) + '"><span>' + (o.w === '.' ? '(terminar)' : esc(o.w)) + '</span><span class="tr"><i style="width:' + Math.round(o.p * 100) + '%"></i></span><b>' + Math.round(o.p * 100) + '%</b></button>').join('');
        $('#ctl').innerHTML = (ended ? '' : '<button class="btn" id="top">Elegir la más probable</button><button class="btn" id="rnd">Elegir al azar con esas probabilidades</button>') + '<button class="btn small" id="new">' + (ended ? 'Armar otra oración' : 'Empezar de nuevo') + '</button>';
        $('#info').innerHTML = '<div class="stat"><b>' + done + '</b><small>oraciones terminadas · ROBI conoce ' + M.words + ' palabras y ' + M.pairs + ' pares de palabras</small></div>' +
          (ended ? '<div class="note info"><p>¿Es verdad lo que dijo ROBI? ¿Lo sabe, o solo siguió patrones?</p></div>' : '') +
          (size === 10 && !ended && list.length === 1 ? '<div class="note info"><p>Con pocas oraciones, a veces ROBI solo conoce una opción. Probá con más oraciones.</p></div>' : '');
      }
      function pick(w) { cur.push(w); if (w === '.') { done++; if (done >= 3) markGoal('lm'); } render(); }
      el.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        if (b.dataset.n) { size = +b.dataset.n; M = build(size); cur = ['<s>']; document.querySelectorAll('#sz button').forEach(x => x.classList.toggle('on', +x.dataset.n === size)); return render(); }
        if (b.dataset.w) return pick(b.dataset.w);
        if (b.id === 'new') { cur = ['<s>']; return render(); }
        if (b.id === 'top') return pick(probs(cur[cur.length - 1])[0].w);
        if (b.id === 'rnd') { const l = probs(cur[cur.length - 1]); let r = Math.random(), a = 0; for (const o of l) { a += o.p; if (r <= a) return pick(o.w); } return pick(l[l.length - 1].w); }
      });
      render();
    }
  };
})();
